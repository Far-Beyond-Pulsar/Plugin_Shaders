name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    # This plugin has path dependencies into the Pulsar-Native workspace
    # (`../blueprint_editor/graph`, `../../../crates/...`), so it builds inside
    # a Pulsar-Native checkout, at the path Pulsar-Native vendors it under.
    - uses: actions/checkout@v4
      with:
        repository: Far-Beyond-Pulsar/Pulsar-Native
        submodules: recursive
        path: pulsar
    - uses: actions/checkout@v4
      with:
        path: pulsar/plugins/vendor/shader_editor
    - name: Install Linux dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          pkg-config \
          libssl-dev \
          libfontconfig1-dev \
          libfreetype6-dev \
          libx11-dev \
          libxext-dev \
          libxrender-dev \
          libxcb1-dev \
          libxcb-render0-dev \
          libxcb-shape0-dev \
          libxcb-xfixes0-dev \
          libwayland-dev \
          libxkbcommon-dev \
          libegl1-mesa-dev \
          libgl1-mesa-dev \
          libvulkan-dev \
          libsqlite3-dev \
          libgit2-dev \
          libssh2-1-dev \
          libzstd-dev \
          libasound2-dev \
          libudev-dev
    - name: Cache Rust build
      uses: Swatinem/rust-cache@v2
      with:
        workspaces: pulsar/plugins/vendor/shader_editor
    - name: Build
      working-directory: pulsar/plugins/vendor/shader_editor
      run: cargo build --verbose
    - name: Run tests
      working-directory: pulsar/plugins/vendor/shader_editor
      run: cargo test --verbose
